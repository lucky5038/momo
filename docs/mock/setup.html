<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>引导表单 · 纸墨封面（示意）</title>
<style>
  :root {
    --paper: #f7f3ea;
    --paper-2: #fffdf7;
    --ink: #1c1b19;
    --ink-2: #4a463f;
    --ink-3: #8a8578;
    --line: #d8d0bf;
    --line-soft: #e6decb;
    --seal: #a8322d;
    --seal-wash: rgba(168, 50, 45, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Microsoft YaHei", "微软雅黑", system-ui, sans-serif;
    overflow: hidden; position: relative;
  }
  .wash, .wash-2, .grain { position: fixed; inset: -20%; pointer-events: none; }
  .wash {
    background:
      radial-gradient(38% 32% at 20% 24%, rgba(28, 27, 25, 0.12), transparent 70%),
      radial-gradient(30% 26% at 80% 78%, rgba(168, 50, 45, 0.045), transparent 72%);
    filter: blur(6px);
    animation: drift1 34s ease-in-out infinite alternate;
  }
  .wash-2 {
    background: radial-gradient(26% 22% at 68% 16%, rgba(28, 27, 25, 0.07), transparent 74%);
    filter: blur(10px);
    animation: drift2 46s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 1.5%, 0) scale(1.06); }
  }
  @keyframes drift2 {
    from { transform: translate3d(1.5%, 1%, 0) scale(1.04); }
    to   { transform: translate3d(-2%, -1.5%, 0) scale(1); }
  }
  .grain {
    background-image: radial-gradient(rgba(28, 27, 25, 0.055) 0.5px, transparent 0.5px);
    background-size: 4px 4px; opacity: 0.7;
  }

  .stage { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 40px 56px 26px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--paper-2); border: 1px solid var(--line);
    display: grid; place-items: center;
    font: 700 17px/1 "Microsoft YaHei", sans-serif; color: var(--seal);
  }
  .brand .name { font-size: 16px; font-weight: 700; }
  .brand .slogan { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }

  /* 步骤：01 / 02 极简进度，代替“第 2 步 共 2 步”的啰嗦 */
  .progress { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); letter-spacing: 1.6px; }
  .progress b { color: var(--ink-3); font-weight: 600; }
  .progress b.on { color: var(--seal); }
  .progress i { width: 30px; height: 1px; background: var(--line); display: block; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 64px; align-items: center; }
  .intro h1 { margin: 0; font-size: 40px; line-height: 1.15; letter-spacing: -1px; font-weight: 900; }
  .intro p { margin: 16px 0 0; font-size: 13.5px; line-height: 1.95; color: var(--ink-2); max-width: 380px; }
  .intro .tip {
    margin-top: 26px; display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--ink-3);
  }
  .intro .tip::before { content: ""; width: 22px; height: 1px; background: var(--seal); opacity: 0.8; }

  .form { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 30px 32px 26px; box-shadow: 0 18px 46px rgba(28, 27, 25, 0.07); }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .field { display: block; margin-bottom: 18px; }
  .field > span { display: block; font-size: 12px; letter-spacing: 1px; color: var(--ink-3); margin-bottom: 7px; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; font-size: 14px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 7px; outline: none;
    font-family: inherit; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus, .field select:focus { border-color: var(--seal); box-shadow: 0 0 0 3px var(--seal-wash); }
  .field .hint { display: block; margin-top: 6px; font-size: 11.5px; font-style: normal; color: var(--ink-3); }
  .db-row { display: flex; gap: 10px; }
  .db-row select { flex: 1; }
  .btn {
    appearance: none; cursor: pointer; font-family: inherit;
    padding: 11px 18px; border-radius: 7px; font-size: 13.5px; font-weight: 600;
    background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line);
    white-space: nowrap; transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .btn-primary {
    background: var(--seal); color: #fff; border-color: var(--seal);
    padding: 12px 26px; font-size: 14.5px; letter-spacing: 0.8px;
    box-shadow: 0 6px 18px rgba(168, 50, 45, 0.2);
  }
  .form-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--line-soft); }

  footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; font-size: 11.5px; color: var(--ink-3); }
  footer .ver { font-family: Consolas, monospace; }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="wash-2"></div>
  <div class="grain"></div>

  <div class="stage">
    <header>
      <div class="brand">
        <div class="mark">N</div>
        <div>
          <div class="name">N-B助手</div>
          <div class="slogan">让ERP在中国普遍成功</div>
        </div>
      </div>
      <div class="progress"><b>01</b><i></i><b class="on">02</b></div>
    </header>

    <main>
      <div class="intro">
        <h1>填写连接信息</h1>
        <p>服务器填 ERP 数据库所在的机器，本机就填 127.0.0.1；账号一般是 sa。</p>
        <div class="tip">连上后从列表里选一个账套</div>
      </div>

      <div class="form">
        <div class="row">
          <label class="field">
            <span>服务器</span>
            <input value="127.0.0.1" />
            <em class="hint">ERP 数据库所在机器</em>
          </label>
          <label class="field">
            <span>账号</span>
            <input value="sa" />
            <em class="hint">SQL Server 登录名</em>
          </label>
          <label class="field">
            <span>密码</span>
            <input type="password" value="123" />
            <em class="hint">只存本机</em>
          </label>
        </div>

        <label class="field">
          <span>账套</span>
          <div class="db-row">
            <select><option>—— 请先读取账套 ——</option></select>
            <button class="btn">读取账套</button>
          </div>
        </label>

        <div class="form-footer">
          <button class="btn">上一步</button>
          <button class="btn btn-primary">保存并进入软件</button>
        </div>
      </div>
    </main>

    <footer>
      <span>科技不是高高在上，而是服务于人民</span>
      <span class="ver">v2.9.7</span>
    </footer>
  </div>
</body>
</html>
