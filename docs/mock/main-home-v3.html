<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>主界面 · 十步封面</title>
<style>
  :root{
    --paper:#f7f3ea; --paper-2:#fffdf7; --paper-3:#fbf7ee;
    --ink:#1c1b19; --ink-2:#4a463f; --ink-3:#8a8578;
    --line:#d8d0bf; --line-soft:#e6decb;
    --seal:#a8322d; --seal-wash:rgba(168,50,45,.07);
    --ok:#3f7a5e; --ok-wash:rgba(63,122,94,.10);
    --shadow-sm:inset 0 0 0 1px rgba(28,27,25,.08);
    --shadow-pop:0 10px 26px rgba(28,27,25,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(28,27,25,.035) .5px,transparent .5px);background-size:4px 4px}
  .wash{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none}
  .wash.a{width:780px;height:780px;left:-200px;top:-260px;background:rgba(168,50,45,.05);animation:br 34s ease-in-out infinite}
  .wash.b{width:900px;height:900px;right:-280px;bottom:-340px;background:rgba(120,110,90,.05);animation:br 46s ease-in-out infinite reverse}
  @keyframes br{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.1) translate(18px,-14px)}}

  .app{position:relative;height:100%;display:flex;flex-direction:column;padding:20px 38px 12px}

  .top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand img{width:34px;height:34px;border-radius:9px;object-fit:cover;box-shadow:var(--shadow-sm)}
  .brand b{font-size:16px;letter-spacing:.5px}
  .brand span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
  .topright{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--ink-3)}
  .state{display:inline-flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-wash)}
  .gear{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);background:var(--paper-2)}

  .headline{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
  .headline h1{margin:0;font-size:23px;letter-spacing:1.2px;font-weight:800}
  .headline h1 em{font-style:normal;color:var(--seal)}
  .mini{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border:1px dashed var(--line);border-radius:999px;background:rgba(255,253,247,.6)}
  .mini .k{font-size:10px;letter-spacing:1.2px;color:var(--ink-3);border-right:1px solid var(--line-soft);padding-right:9px}
  .mini b{font-size:12.5px;color:var(--ink-2);font-weight:700;letter-spacing:1px}
  .mini i{font-style:normal;font-size:10.5px;color:var(--ink-3)}

  .grid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;min-height:0}

  .tile{position:relative;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;
        background:var(--paper-3);border:1px dashed var(--line);overflow:hidden}
  .tile .no{position:relative;font-size:10.5px;letter-spacing:1.8px;color:var(--ink-3)}
  .art{flex:1;display:grid;place-items:center;color:var(--ink-3);opacity:.55}
  .art svg{width:86px;height:86px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .tile .nm{position:relative;font-size:24px;font-weight:800;letter-spacing:1.5px;color:var(--ink-3);line-height:1.2}
  .tile .desc{position:relative;margin-top:6px;font-size:11.5px;color:var(--ink-3);opacity:.9}
  .tile .st{position:relative;margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
  .tile .st i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
  .tile .go{position:absolute;right:16px;bottom:16px;font-size:12px;color:var(--seal)}

  .tile.live{background:var(--paper-2);border:1px solid rgba(168,50,45,.30);box-shadow:var(--shadow-pop)}
  .tile.live .no{color:var(--seal)}
  .tile.live .art{color:var(--seal);opacity:.9}
  .tile.live .nm{color:var(--ink)}
  .tile.live .desc{color:var(--ink-2);opacity:1}
  .tile.live .st{color:var(--seal)}
  .tile.live .st i{opacity:1}
  .tile.live::after{content:"";position:absolute;left:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:var(--seal-wash)}

  .foot{display:flex;align-items:center;justify-content:flex-end;padding-top:10px;color:var(--ink-3);font-size:11px;letter-spacing:.4px}
</style>
</head>
<body>
  <div class="wash a"></div><div class="wash b"></div>
  <div class="app">
    <div class="top">
      <div class="brand">
        <img src="../../source/renderer/src/assets/app-icon.png" alt="N-B助手" />
        <div><b>N-B助手</b><span>实施流程优化</span></div>
      </div>
      <div class="topright">
        <span class="state"><i class="dot"></i>已就绪</span>
        <span>账套 XBK</span>
        <span class="gear">⚙</span>
      </div>
    </div>

    <div class="headline">
      <h1>科技不再是高高在上，<em>而是服务于人民</em></h1>
      <span class="mini"><span class="k">预留</span><b>N-B</b><i>规划中</i></span>
    </div>

    <div class="grid">
      <div class="tile">
        <span class="no">01</span>
        <div class="art"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.4l6.2 3.6-6.2 3.6z"/></svg></div>
        <div><div class="nm">启动</div><div class="st"><i></i>规划中</div></div>
      </div>

      <div class="tile">
        <span class="no">02</span>
        <div class="art"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></div>
        <div><div class="nm">安装</div><div class="st"><i></i>规划中</div></div>
      </div>

      <div class="tile live">
        <span class="no">03</span>
        <div class="art"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="7.2" height="14" rx="1.6"/><rect x="14.3" y="5" width="7.2" height="14" rx="1.6"/><path d="M9.9 12h4.1"/><path d="M12.6 10l1.6 2-1.6 2"/></svg></div>
        <div><div class="nm">编码</div><div class="st"><i></i>正在开发</div><span class="go">进入 →</span></div>
      </div>

      <div class="tile">
        <span class="no">04</span>
        <div class="art"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.2"/><path d="M15.4 15.4L20.2 20.2"/><path d="M8.2 9.2h5M8.2 12h3.4"/></svg></div>
        <div><div class="nm">调研</div><div class="st"><i></i>规划中</div></div>
      </div>

      <div class="tile">
        <span class="no">05</span>
        <div class="art"><svg viewBox="0 0 24 24"><rect x="2.8" y="4.2" width="12.6" height="9.6" rx="1.6"/><circle cx="19" cy="9.6" r="2.1"/><path d="M15.6 16.2c0-2.2 1.6-3.4 3.4-3.4s3.4 1.2 3.4 3.4"/><path d="M8.9 7.2v3.4"/></svg></div>
        <div><div class="nm">培训</div><div class="st"><i></i>规划中</div></div>
      </div>

      <div class="tile">
        <span class="no">06</span>
        <div class="art"><svg viewBox="0 0 24 24"><rect x="2.8" y="5" width="18.4" height="14" rx="2" stroke-dasharray="3 2.4"/><path d="M10 9.4l5.2 2.6-5.2 2.6z"/></svg></div>
        <div><div class="nm">模拟</div><div class="st"><i></i>规划中</div></div>
      </div>

      <div class="tile live">
        <span class="no">07</span>
        <div class="art"><svg viewBox="0 0 24 24"><rect x="2.8" y="4.6" width="18.4" height="14.8" rx="1.8"/><path d="M2.8 9.4h18.4M8.6 9.4v10"/><path d="M17.2 13v5.4M15 15.4l2.2-2.4 2.2 2.4"/></svg></div>
        <div><div class="nm">期初</div><div class="st"><i></i>正在开发</div><span class="go">进入 →</span></div>
      </div>

      <div class="tile">
        <span class="no">08</span>
        <div class="art"><svg viewBox="0 0 24 24"><path d="M3 5.4h10.2v6.6H7.4L3 15.4z"/><path d="M12.6 9h8.4v6.4h-3l-3.6 3z"/></svg></div>
        <div><div class="nm">上线会议</div><div class="st"><i></i>规划中</div></div>
      </div>

      <div class="tile live">
        <span class="no">09</span>
        <div class="art"><svg viewBox="0 0 24 24"><rect x="4.2" y="2.8" width="15.6" height="18.4" rx="2"/><path d="M7.8 8.4l1.8 1.8 3.4-3.4"/><path d="M7.8 14h8M7.8 17.2h5"/></svg></div>
        <div><div class="nm">检查</div><div class="st"><i></i>正在开发</div><span class="go">进入 →</span></div>
      </div>

      <div class="tile">
        <span class="no">10</span>
        <div class="art"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4" stroke-dasharray="2.4 2.4"/><path d="M8.6 12.2l2.4 2.4 4.6-5"/></svg></div>
        <div><div class="nm">结案</div><div class="st"><i></i>规划中</div></div>
      </div>
    </div>

    <div class="foot"><span>v2.10.0</span></div>
  </div>
</body>
</html>
