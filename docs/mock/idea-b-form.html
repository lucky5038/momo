<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方案 B · 引导表单（深色）</title>
<style>
  :root{
    --bg:#0b0d10; --fg:#f2ede2; --fg-2:#a9a49a; --fg-3:#6f6a62;
    --gold:#c9a25c; --line:rgba(242,237,226,.14); --line-2:rgba(242,237,226,.07);
    --field:#151a20; --field-2:#1b2129;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);overflow:hidden;position:relative;
    font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif}
  .glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(70px)}
  .glow.g1{width:58vw;height:58vw;right:-14vw;top:-20vw;background:radial-gradient(circle,rgba(201,162,92,.16),transparent 62%);
    animation:sway 28s ease-in-out infinite alternate}
  .glow.g2{width:44vw;height:44vw;left:-16vw;bottom:-22vw;background:radial-gradient(circle,rgba(58,96,140,.20),transparent 64%);
    animation:sway 38s ease-in-out infinite alternate-reverse}
  @keyframes sway{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.1)}}
  .mesh{position:fixed;inset:0;pointer-events:none;opacity:.42;
    background-image:linear-gradient(rgba(242,237,226,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(242,237,226,.045) 1px,transparent 1px);
    background-size:64px 64px;mask-image:radial-gradient(70% 60% at 30% 40%,#000 0%,transparent 78%)}
  .noise{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.10) .5px,transparent .5px);background-size:3px 3px}

  .stage{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:38px 54px 24px}
  header{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--gold),#8d6d33);
    color:#17130c;display:grid;place-items:center;font:900 18px/1 "Microsoft YaHei",sans-serif;
    box-shadow:0 6px 20px rgba(201,162,92,.28)}
  .name{font-size:15px;font-weight:700;letter-spacing:1.2px}
  .slogan{font-size:10.5px;color:var(--fg-3);letter-spacing:1px;margin-top:2px}
  .progress{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:3px;color:var(--fg-3)}
  .progress b{font-weight:600} .progress b.on{color:var(--gold)}
  .progress i{width:30px;height:1px;background:var(--line);display:block}

  main{display:grid;grid-template-columns:minmax(0,1fr) 520px;align-items:center;gap:56px}
  .intro h1{margin:0;font-size:44px;line-height:1.12;letter-spacing:-1.2px;font-weight:900;color:#fff}
  .intro p{margin:16px 0 0;font-size:13px;line-height:1.95;color:var(--fg-2);max-width:360px}
  .intro .tip{margin-top:22px;display:inline-flex;align-items:center;gap:9px;font-size:12px;color:var(--fg-3)}
  .intro .tip::before{content:"";width:24px;height:1px;background:var(--gold);opacity:.7}

  .glass{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid var(--line);border-radius:12px;padding:26px 26px 22px;
    backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .field{display:block;margin-bottom:16px}
  .field>span{display:block;font-size:11px;letter-spacing:1.6px;color:var(--fg-3);margin-bottom:7px}
  .field input,.field select{
    width:100%;padding:11px 13px;font-size:13.5px;color:var(--fg);background:var(--field);
    border:1px solid var(--line);border-radius:6px;outline:none;font-family:inherit;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease
  }
  .field input:focus,.field select:focus{border-color:var(--gold);background:var(--field-2);
    box-shadow:0 0 0 3px rgba(201,162,92,.16)}
  .field .hint{display:block;margin-top:6px;font-size:10.5px;font-style:normal;color:var(--fg-3)}
  .db-row{display:flex;gap:10px} .db-row select{flex:1}
  .btn{appearance:none;cursor:pointer;font-family:inherit;padding:11px 16px;border-radius:6px;
    font-size:12.5px;font-weight:600;color:var(--fg-2);background:rgba(255,255,255,.04);
    border:1px solid var(--line);white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
  .btn:hover{border-color:rgba(201,162,92,.5);color:var(--fg)}
  .btn-primary{background:var(--gold);color:#17130c;border-color:var(--gold);
    padding:12px 24px;font-size:14px;letter-spacing:1px;box-shadow:0 10px 26px rgba(201,162,92,.24)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(201,162,92,.32)}
  .form-footer{display:flex;align-items:center;justify-content:flex-end;gap:12px;
    margin-top:4px;padding-top:16px;border-top:1px solid var(--line-2)}
  .dots{display:flex;gap:5px;margin-top:14px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--fg-3);opacity:.5;animation:pulse 2.4s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.25s}.dot:nth-child(3){animation-delay:.5s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1;background:var(--gold)}}

  footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-2);
    padding-top:13px;font-size:10.5px;color:var(--fg-3);letter-spacing:1px}
  .ver{font-family:Consolas,monospace}
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="mesh"></div><div class="noise"></div>

  <div class="stage">
    <header>
      <div class="brand">
        <div class="mark">N</div>
        <div><div class="name">N-B助手</div><div class="slogan">实施流程优化</div></div>
      </div>
      <div class="progress"><b>01</b><i></i><b class="on">02</b></div>
    </header>

    <main>
      <div class="intro">
        <h1>填写连接信息</h1>
        <p>服务器填 ERP 数据库所在的机器，本机就填 127.0.0.1；账号一般是 sa。</p>
        <div class="tip">连上后从列表里选一个账套</div>
      </div>

      <div class="glass">
        <div class="row">
          <label class="field"><span>服务器</span><input value="127.0.0.1" /><em class="hint">数据库所在机器</em></label>
          <label class="field"><span>账号</span><input value="sa" /><em class="hint">SQL Server 登录名</em></label>
          <label class="field"><span>密码</span><input type="password" value="123" /><em class="hint">只存本机</em></label>
        </div>
        <label class="field">
          <span>账套</span>
          <div class="db-row">
            <select><option>—— 请先读取账套 ——</option></select>
            <button class="btn">读取账套</button>
          </div>
        </label>
        <div class="form-footer">
          <button class="btn">上一步</button>
          <button class="btn btn-primary">保存并进入软件</button>
        </div>
        <div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
      </div>
    </main>

    <footer><span>科技不再是高高在上，而是服务于人民</span><span class="ver">v2.9.7</span></footer>
  </div>
</body>
</html>
