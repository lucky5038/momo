<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方案 B · 深色电影感</title>
<style>
  :root{
    --bg:#0b0d10; --bg-2:#12161b; --fg:#f2ede2; --fg-2:#a9a49a; --fg-3:#6f6a62;
    --gold:#c9a25c; --line:rgba(242,237,226,.14); --line-2:rgba(242,237,226,.07);
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden; position:relative;
    font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;
  }
  /* 背景：大面积光晕 + 网格水印 + 噪点，营造"暗房"感 */
  .glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(70px)}
  .glow.g1{width:62vw;height:62vw;right:-16vw;top:-22vw;background:radial-gradient(circle,rgba(201,162,92,.20),transparent 62%);
    animation:sway 28s ease-in-out infinite alternate}
  .glow.g2{width:48vw;height:48vw;left:-18vw;bottom:-24vw;background:radial-gradient(circle,rgba(58,96,140,.22),transparent 64%);
    animation:sway 38s ease-in-out infinite alternate-reverse}
  @keyframes sway{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.1)}}
  .mesh{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(242,237,226,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(242,237,226,.045) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(70% 60% at 68% 34%,#000 0%,transparent 78%)}
  .noise{position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.10) .5px,transparent .5px);background-size:3px 3px}

  .stage{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:38px 54px 24px}

  header{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--gold),#8d6d33);
    color:#17130c;display:grid;place-items:center;font:900 18px/1 "Microsoft YaHei",sans-serif;
    box-shadow:0 6px 20px rgba(201,162,92,.28)}
  .name{font-size:15px;font-weight:700;letter-spacing:1.2px}
  .slogan{font-size:10.5px;color:var(--fg-3);letter-spacing:1px;margin-top:2px}
  .kicker{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:600;
    letter-spacing:3px;color:var(--gold);opacity:.9}
  .kicker::before{content:"";width:28px;height:1px;background:var(--gold);opacity:.7}

  main{display:grid;grid-template-columns:minmax(0,1fr) 470px;align-items:center;gap:56px}
  .hero h1{margin:0;font-size:64px;line-height:1.04;letter-spacing:-2px;font-weight:900;color:#fff}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{margin:20px 0 0;font-size:13.5px;line-height:2;color:var(--fg-2);max-width:430px}
  .actions{margin-top:36px;display:flex;align-items:center;gap:18px}
  .btn{border:0;cursor:pointer;font-family:inherit;padding:15px 34px;border-radius:4px;
    background:var(--gold);color:#17130c;font-size:15px;font-weight:800;letter-spacing:1.4px;
    box-shadow:0 10px 28px rgba(201,162,92,.26);transition:transform .16s ease,box-shadow .16s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(201,162,92,.34)}
  .note{font-size:12px;color:var(--fg-3);letter-spacing:1px}

  /* 右侧"玻璃"连接卡：一眼看出这是填数据库的 */
  .glass{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:12px;padding:26px 26px 22px;
    backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.45)
  }
  .glass .cap{display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;letter-spacing:2px;color:var(--fg-3);margin-bottom:18px}
  .glass .cap b{color:var(--gold);font-weight:600}
  .line{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line-2);font-size:13px}
  .line:first-of-type{border-top:0}
  .line span{color:var(--fg-3);font-size:12px;letter-spacing:.6px}
  .line b{color:var(--fg);font-weight:600;font-family:Consolas,monospace;font-size:12.5px}
  .line b.dim{color:var(--fg-3)}
  .dots{display:flex;gap:5px;margin-top:16px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--fg-3);opacity:.5;
    animation:pulse 2.4s ease-in-out infinite}
  .dot:nth-child(2){animation-delay:.25s}.dot:nth-child(3){animation-delay:.5s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1;background:var(--gold)}}

  footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-2);
    padding-top:13px;font-size:10.5px;color:var(--fg-3);letter-spacing:1px}
  .ver{font-family:Consolas,monospace}
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="mesh"></div><div class="noise"></div>

  <div class="stage">
    <header>
      <div class="brand">
        <div class="mark">N</div>
        <div><div class="name">N-B助手</div><div class="slogan">实施流程优化</div></div>
      </div>
      <div class="kicker">第一次使用</div>
    </header>

    <main>
      <div class="hero">
        <h1>科技不再是高高在上<br /><em>而是服务于人民</em></h1>
        <p>把实施里重复的流程，一件件交给工具。</p>
        <div class="actions">
          <button class="btn">开始设置</button>
          <span class="note">2 步 · 约 1 分钟</span>
        </div>
      </div>

      <div class="glass">
        <div class="cap"><span>实施流程</span><b>已覆盖 3 / 5</b></div>
        <div class="line"><span>初始化 · 资料清洗导入</span><b>已覆盖</b></div>
        <div class="line"><span>带值 · 跨表带值</span><b>已覆盖</b></div>
        <div class="line"><span>带值 · 触发器自动</span><b>已覆盖</b></div>
        <div class="line"><span>对账 · 数据体检</span><b class="dim">规划中</b></div>
        <div class="line"><span>巡检 · 一句话带值</span><b class="dim">规划中</b></div>
        <div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
      </div>
    </main>

    <footer><span>N-B助手 · 让ERP在中国普遍成功</span><span class="ver">v2.9.7</span></footer>
  </div>
</body>
</html>
