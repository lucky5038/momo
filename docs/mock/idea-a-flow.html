<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方案 A · 数据流（纸墨）</title>
<style>
  :root {
    --paper:#f7f3ea; --paper-2:#fffdf7; --ink:#1c1b19; --ink-2:#4a463f; --ink-3:#8a8578;
    --line:#d8d0bf; --seal:#a8322d; --seal-wash:rgba(168,50,45,.1);
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{
    background:var(--paper);color:var(--ink);overflow:hidden;position:relative;
    font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;
  }
  /* 极淡纸纹 + 两团墨影 */
  .grain{position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(28,27,25,.05) .5px,transparent .5px);background-size:4px 4px;opacity:.75}
  .ink{position:fixed;width:70vw;height:70vw;right:-22vw;top:-26vw;border-radius:50%;
    background:radial-gradient(circle,rgba(28,27,25,.10),transparent 62%);filter:blur(8px);
    animation:breathe 26s ease-in-out infinite alternate}
  .ink.b{left:-26vw;bottom:-30vw;top:auto;right:auto;
    background:radial-gradient(circle,rgba(168,50,45,.10),transparent 64%);animation-duration:34s}
  @keyframes breathe{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.08) translate3d(-2%,2%,0)}}

  .stage{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:38px 54px 24px}

  header{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:34px;height:34px;border-radius:9px;background:var(--seal);color:#fff;
    display:grid;place-items:center;font:900 18px/1 "Microsoft YaHei",sans-serif;letter-spacing:-1px;
    box-shadow:0 4px 12px rgba(168,50,45,.25)}
  .name{font-size:15.5px;font-weight:700;letter-spacing:.5px}
  .slogan{font-size:11px;color:var(--ink-3);margin-top:1px}
  .kicker{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:2.2px;color:var(--ink-3)}
  .kicker::before{content:"";width:24px;height:1px;background:var(--seal);opacity:.8}

  main{display:grid;grid-template-columns:minmax(0,1fr) 520px;align-items:center;gap:40px}
  .hero h1{margin:0;font-size:56px;line-height:1.08;letter-spacing:-1.6px;font-weight:900}
  .hero h1 em{font-style:normal;color:var(--seal)}
  .hero p{margin:18px 0 0;font-size:13.5px;line-height:1.95;color:var(--ink-2);max-width:430px}
  .actions{margin-top:34px;display:flex;align-items:center;gap:16px}
  .btn{border:0;cursor:pointer;font-family:inherit;padding:14px 30px;border-radius:8px;
    background:var(--seal);color:#fff;font-size:15px;font-weight:600;letter-spacing:1px;
    box-shadow:0 8px 20px rgba(168,50,45,.22);transition:transform .16s ease,box-shadow .16s ease}
  .btn:hover{transform:translateY(-1px)} .btn:active{transform:scale(.985)}
  .note{font-size:12.5px;color:var(--ink-3)}

  /* ===== 主视觉：两张表 + 一条流动的数据 ===== */
  .flow{position:relative;height:360px}
  .table{
    position:absolute;padding:12px;border-radius:10px;background:var(--paper-2);
    border:1px solid var(--line);box-shadow:0 14px 34px rgba(28,27,25,.07)
  }
  .table.a{left:0;top:36px;width:190px}
  .table.b{right:0;bottom:26px;width:200px}
  .table .cap{font-size:10.5px;letter-spacing:1.4px;color:var(--ink-3);margin-bottom:9px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cell{height:16px;border-radius:3px;background:rgba(28,27,25,.055)}
  .cell.hl{background:var(--seal-wash);box-shadow:inset 0 0 0 1px rgba(168,50,45,.35)}
  .cell.hl2{background:rgba(168,50,45,.16);box-shadow:inset 0 0 0 1px rgba(168,50,45,.5)}

  /* 曲线：用 offset-path 让一个点沿贝塞尔走 */
  .wire{position:absolute;inset:0;pointer-events:none}
  .dot{
    width:9px;height:9px;border-radius:50%;background:var(--seal);
    box-shadow:0 0 0 4px rgba(168,50,45,.12),0 0 14px rgba(168,50,45,.5);
    offset-path:path("M 196 74 C 300 74, 300 250, 404 250");
    animation:run 4.6s cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes run{
    0%{offset-distance:0%;opacity:0}
    8%{opacity:1}
    46%{offset-distance:50%}
    54%{offset-distance:50%;opacity:1}
    92%{offset-distance:100%;opacity:1}
    100%{offset-distance:100%;opacity:0}
  }

  footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);
    padding-top:13px;font-size:11px;color:var(--ink-3)}
  .ver{font-family:Consolas,monospace}
</style>
</head>
<body>
  <div class="grain"></div><div class="ink"></div><div class="ink b"></div>

  <div class="stage">
    <header>
      <div class="brand">
        <div class="mark">N</div>
        <div><div class="name">N-B助手</div><div class="slogan">让ERP在中国普遍成功</div></div>
      </div>
      <div class="kicker">第一次使用</div>
    </header>

    <main>
      <div class="hero">
        <h1>让数据<br /><em>自己走过去</em></h1>
        <p>连上数据库，选好两张单据。中间的路由工具自己算，你只负责确认。</p>
        <div class="actions">
          <button class="btn">开始设置</button>
          <span class="note">2 步 · 约 1 分钟</span>
        </div>
      </div>

      <div class="flow">
        <div class="table a">
          <div class="cap">来源单据</div>
          <div class="grid">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell hl"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
          </div>
        </div>
        <svg class="wire" viewBox="0 0 520 360" preserveAspectRatio="none">
          <path d="M 196 74 C 300 74, 300 250, 404 250" fill="none"
                stroke="rgba(28,27,25,.18)" stroke-width="1" stroke-dasharray="3 4" />
        </svg>
        <div class="dot"></div>
        <div class="table b">
          <div class="cap">目标单据</div>
          <div class="grid">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell hl2"></div><div class="cell"></div>
          </div>
        </div>
      </div>
    </main>

    <footer><span>科技不是高高在上，而是服务于人民</span><span class="ver">v2.9.7</span></footer>
  </div>
</body>
</html>
