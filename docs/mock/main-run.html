<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>带值 · 编码阶段</title>
<style>
  :root{
    --paper:#f7f3ea; --paper-2:#fffdf7; --paper-3:#fbf7ee; --wash:#ede7d9;
    --ink:#1c1b19; --ink-2:#4a463f; --ink-3:#8a8578;
    --line:#d8d0bf; --line-soft:#e6decb;
    --seal:#a8322d; --seal-wash:rgba(168,50,45,.08);
    --ok:#3f7a5e; --ok-wash:rgba(63,122,94,.10);
    --shadow-sm:inset 0 0 0 1px rgba(28,27,25,.08);
    --shadow-pop:0 8px 24px rgba(28,27,25,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","微软雅黑",system-ui,sans-serif;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(28,27,25,.035) .5px,transparent .5px);background-size:4px 4px}
  .app{position:relative;height:100%;display:flex;flex-direction:column;padding:22px 40px 16px}

  /* 顶栏 */
  .top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
  .left{display:flex;align-items:center;gap:14px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);text-decoration:none;padding:5px 10px 5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--paper-2)}
  .crumb{font-size:12px;color:var(--ink-3)}
  .crumb b{color:var(--seal);font-weight:600}
  .right{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--ink-3)}
  .state{display:inline-flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-wash)}
  .gear{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);background:var(--paper-2)}

  /* 标题 + 页内标签 */
  .head{display:flex;align-items:flex-end;justify-content:space-between;margin:18px 0 14px}
  h1{margin:0;font-size:26px;letter-spacing:.6px}
  .tabs{display:flex;gap:6px}
  .tab{font-size:12.5px;color:var(--ink-3);padding:7px 14px;border-radius:999px;border:1px solid transparent;cursor:pointer}
  .tab.on{color:#fff;background:var(--seal);box-shadow:0 6px 14px rgba(168,50,45,.2)}

  /* 两栏 */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:0;align-items:start}
  .card{background:var(--paper-2);border:1px solid var(--line-soft);border-radius:8px;padding:16px 18px 14px;box-shadow:var(--shadow-sm)}
  .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
  .cap b{font-size:12px;color:var(--seal);letter-spacing:1px}
  .cap span{font-size:12.5px;color:var(--ink-3)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .ctl{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 10px;font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:space-between}
  .ctl.muted{background:var(--paper-3);color:var(--ink-3)}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:6px}
  .btnrow{display:flex;gap:10px;margin-top:12px}
  .btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2);font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .btn.danger{color:var(--seal);border-color:rgba(168,50,45,.35)}
  .arrow{display:grid;place-items:center;color:var(--ink-3);font-size:16px;padding-top:70px}

  /* 高级选项 + 操作条 */
  .adv{margin-top:14px;background:var(--paper-2);border:1px solid var(--line-soft);border-radius:8px;padding:12px 18px;display:flex;align-items:center;gap:22px;font-size:12.5px;color:var(--ink-2)}
  .adv .t{color:var(--ink-3);font-size:12px}
  .chk{display:inline-flex;align-items:center;gap:7px}
  .box{width:14px;height:14px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .box.on{background:var(--seal);border-color:var(--seal);position:relative}
  .box.on::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:10px;display:grid;place-items:center}

  .bar{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line-soft)}
  .bar .tip{font-size:12px;color:var(--ink-3)}
  .actions{display:flex;gap:10px}
  .big{height:36px;padding:0 22px;border-radius:6px;font-size:13px;display:inline-flex;align-items:center}
  .big.ghost{background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2)}
  .big.main{background:var(--seal);color:#fff;border:1px solid var(--seal);box-shadow:0 8px 18px rgba(168,50,45,.22)}
</style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="left">
        <a class="back" href="#">← 十步</a>
        <span class="crumb">易助实施 · <b>03 编码</b></span>
      </div>
      <div class="right">
        <span class="state"><i class="dot"></i>已就绪</span>
        <span>账套 XBK</span>
        <span class="gear">⚙</span>
      </div>
    </div>

    <div class="head">
      <h1>带值</h1>
      <div class="tabs"><span class="tab on">跨表带值</span><span class="tab">触发器</span></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="cap"><b>01</b><span>目标</span></div>
        <div class="field">
          <label>目标单据（主表）</label>
          <div class="ctl">JSKJDB 验收(退)/进货单单头档 <span>▾</span></div>
        </div>
        <div class="field">
          <label>目标列（要写入哪一列）</label>
          <div class="ctl">JDB960 自定文字1 <span>▾</span></div>
          <div class="hint">共 33 个自定义字段（系统默认字段不支持带值，请选择）</div>
        </div>
        <div class="btnrow"><span class="btn danger">清除目标字段</span><span class="btn">执行前自动备份</span></div>
      </div>

      <div class="arrow">→</div>

      <div class="card">
        <div class="cap"><b>02</b><span>来源</span></div>
        <div class="field">
          <label>来源档（自动排除已选单据）</label>
          <div class="ctl">DCSHDB 采购单单头档 <span>▾</span></div>
        </div>
        <div class="field">
          <label>来源值列（取哪一列的值）</label>
          <div class="ctl">HDB001 单号 <span>▾</span></div>
          <div class="hint">共 79 个可选值列（默认关联 HDB001）</div>
        </div>
      </div>
    </div>

    <div class="adv">
      <span class="t">高级选项</span>
      <span class="chk"><i class="box on"></i>强制覆盖</span>
      <span class="chk"><i class="box"></i>建立触发器</span>
      <span class="chk"><i class="box"></i>合并显示</span>
    </div>

    <div class="bar">
      <span class="tip">执行前自动备份到 D:\TPA\SQL2008；强制覆盖会先清空目标列。</span>
      <div class="actions"><span class="big ghost">预览</span><span class="big main">执行</span></div>
    </div>
  </div>
</body>
</html>
