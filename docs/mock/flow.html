<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>欢迎 → 引导 过渡演示</title>
<style>
  :root {
    --paper: #f7f3ea; --paper-2: #fffdf7; --ink: #1c1b19; --ink-2: #4a463f; --ink-3: #8a8578;
    --line: #d8d0bf; --line-soft: #e6decb; --seal: #a8322d; --seal-wash: rgba(168, 50, 45, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink); overflow: hidden; position: relative;
    font-family: "Microsoft YaHei", "微软雅黑", system-ui, sans-serif;
  }

  /* 动态纸墨底 */
  .wash, .wash-2, .grain { position: fixed; inset: -20%; pointer-events: none; }
  .wash {
    background:
      radial-gradient(38% 32% at 22% 26%, rgba(28,27,25,0.13), transparent 70%),
      radial-gradient(30% 26% at 78% 74%, rgba(168,50,45,0.075), transparent 72%);
    filter: blur(6px); animation: drift1 34s ease-in-out infinite alternate;
  }
  .wash-2 {
    background:
      radial-gradient(26% 22% at 66% 18%, rgba(28,27,25,0.07), transparent 74%),
      radial-gradient(34% 30% at 14% 82%, rgba(28,27,25,0.07), transparent 76%);
    filter: blur(10px); animation: drift2 46s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate3d(-1.5%,-1%,0) scale(1); } to { transform: translate3d(2%,1.5%,0) scale(1.06); } }
  @keyframes drift2 { from { transform: translate3d(1.5%,1%,0) scale(1.04); } to { transform: translate3d(-2%,-1.5%,0) scale(1); } }
  .grain {
    background-image: radial-gradient(rgba(28,27,25,0.055) 0.5px, transparent 0.5px);
    background-size: 4px 4px; opacity: 0.7;
  }

  /* 屏幕容器：两屏叠在一起，用 .on 控制显隐（PPT 式淡入淡出 + 轻微位移） */
  .screen {
    position: absolute; inset: 0;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: 40px 56px 26px;
    opacity: 0; visibility: hidden;
    transform: translate3d(0, 12px, 0) scale(0.995);
    transition: opacity 320ms ease, transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1), visibility 0s linear 320ms;
  }
  .screen.on {
    opacity: 1; visibility: visible;
    transform: translate3d(0, 0, 0) scale(1);
    transition: opacity 320ms ease, transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1), visibility 0s;
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 8px; background: var(--paper-2); border: 1px solid var(--line);
    display: grid; place-items: center; font: 700 17px/1 "Microsoft YaHei", sans-serif; color: var(--seal);
  }
  .brand .name { font-size: 16px; font-weight: 700; }
  .brand .slogan { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .kicker { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; letter-spacing: 2.4px; color: var(--ink-3); }
  .kicker::before { content: ""; width: 26px; height: 1px; background: var(--seal); opacity: 0.85; }

  /* 入场动画：元素逐个淡入上移（stagger） */
  .reveal { opacity: 0; transform: translate3d(0, 14px, 0); }
  .screen.on .reveal { animation: rise 520ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
  .screen.on .reveal.d1 { animation-delay: 60ms; }
  .screen.on .reveal.d2 { animation-delay: 140ms; }
  .screen.on .reveal.d3 { animation-delay: 220ms; }
  @keyframes rise { to { opacity: 1; transform: translate3d(0, 0, 0); } }

  main { display: flex; align-items: center; }
  .hero { max-width: 780px; }
  .hero h1 { margin: 0; font-size: 58px; line-height: 1.06; letter-spacing: -1.8px; font-weight: 900; }
  .hero h1 em { font-style: normal; color: var(--seal); }
  .hero .lede { margin: 20px 0 0; font-size: 14px; line-height: 1.9; color: var(--ink-2); max-width: 520px; }
  .hero .lede code { font-family: Consolas, monospace; font-size: 13px; padding: 1px 6px; border-radius: 4px; background: rgba(28,27,25,0.055); }
  .actions { margin-top: 38px; display: flex; align-items: center; gap: 18px; }
  .btn-primary {
    appearance: none; border: 0; cursor: pointer; padding: 15px 34px; border-radius: 8px;
    background: var(--seal); color: #fff; font: 600 15.5px/1 "Microsoft YaHei", sans-serif; letter-spacing: 1px;
    box-shadow: 0 6px 18px rgba(168,50,45,0.22); transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(168,50,45,0.28); }
  .btn-primary:active { transform: translateY(0) scale(0.985); }
  .steps-note { font-size: 12.5px; color: var(--ink-3); }
  .seal-art {
    position: fixed; right: -40px; bottom: -60px; width: 520px; height: 520px; border-radius: 40px;
    border: 22px solid var(--seal-wash); transform: rotate(-9deg); display: grid; place-items: center;
    opacity: 0.42; pointer-events: none;
  }
  .seal-art span { font: 900 260px/1 "Microsoft YaHei", sans-serif; color: var(--seal-wash); letter-spacing: -10px; }

  /* 表单屏 */
  .progress { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 1.6px; color: var(--ink-3); }
  .progress b { font-weight: 600; } .progress b.on { color: var(--seal); }
  .progress i { width: 30px; height: 1px; background: var(--line); display: block; }
  .split { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.35fr); gap: 64px; align-items: center; }
  .intro h1 { margin: 0; font-size: 40px; line-height: 1.15; letter-spacing: -1px; font-weight: 900; }
  .intro p { margin: 16px 0 0; font-size: 13.5px; line-height: 1.95; color: var(--ink-2); max-width: 380px; }
  .intro .tip { margin-top: 26px; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .intro .tip::before { content: ""; width: 22px; height: 1px; background: var(--seal); opacity: 0.8; }
  .form { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 30px 32px 26px; box-shadow: 0 18px 46px rgba(28,27,25,0.07); }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
  .field { display: block; margin-bottom: 18px; }
  .field > span { display: block; font-size: 12px; letter-spacing: 1px; color: var(--ink-3); margin-bottom: 7px; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; font-size: 14px; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 7px; outline: none; font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus, .field select:focus { border-color: var(--seal); box-shadow: 0 0 0 3px var(--seal-wash); }
  .field .hint { display: block; margin-top: 6px; font-size: 11.5px; font-style: normal; color: var(--ink-3); }
  .db-row { display: flex; gap: 10px; } .db-row select { flex: 1; }
  .btn {
    appearance: none; cursor: pointer; font-family: inherit; padding: 11px 18px; border-radius: 7px;
    font-size: 13.5px; font-weight: 600; background: var(--paper-2); color: var(--ink-2);
    border: 1px solid var(--line); white-space: nowrap; transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .btn-primary { background: var(--seal); color: #fff; border-color: var(--seal); padding: 12px 26px; font-size: 14.5px; letter-spacing: 0.8px; }
  .form-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--line-soft); }

  footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; font-size: 11.5px; color: var(--ink-3); }
  footer .ver { font-family: Consolas, monospace; }
</style>
</head>
<body>
  <div class="wash"></div><div class="wash-2"></div><div class="grain"></div>

  <!-- 屏 1：欢迎 -->
  <section class="screen on" id="s1">
    <header>
      <div class="brand reveal d1">
        <div class="mark">N</div>
        <div><div class="name">N-B助手</div><div class="slogan">让ERP在中国普遍成功</div></div>
      </div>
      <div class="kicker reveal d1">第一次使用</div>
    </header>
    <main>
      <div class="hero">
        <h1 class="reveal d1">先把数据库<em>连上</em></h1>
        <p class="lede reveal d2">连上之后自动读取账套与单据字典。配置只写在本机 <code>config.js</code>，不会上传到任何地方。</p>
        <div class="actions reveal d3">
          <button class="btn-primary" onclick="go(2)">开始设置</button>
          <span class="steps-note">2 步 · 约 1 分钟</span>
        </div>
      </div>
    </main>
    <footer><span>科技不是高高在上，而是服务于人民</span><span class="ver">v2.9.7</span></footer>
  </section>

  <!-- 屏 2：引导表单 -->
  <section class="screen" id="s2">
    <header>
      <div class="brand reveal d1">
        <div class="mark">N</div>
        <div><div class="name">N-B助手</div><div class="slogan">让ERP在中国普遍成功</div></div>
      </div>
      <div class="progress reveal d1"><b>01</b><i></i><b class="on">02</b></div>
    </header>
    <main>
      <div class="split">
        <div class="intro">
          <h1 class="reveal d1">填写连接信息</h1>
          <p class="reveal d2">服务器填 ERP 数据库所在的机器，本机就填 127.0.0.1；账号一般是 sa。</p>
          <div class="tip reveal d2">连上后从列表里选一个账套</div>
        </div>
        <div class="form reveal d2">
          <div class="row">
            <label class="field"><span>服务器</span><input value="127.0.0.1" /><em class="hint">ERP 数据库所在机器</em></label>
            <label class="field"><span>账号</span><input value="sa" /><em class="hint">SQL Server 登录名</em></label>
            <label class="field"><span>密码</span><input type="password" value="123" /><em class="hint">只存本机</em></label>
          </div>
          <label class="field">
            <span>账套</span>
            <div class="db-row">
              <select><option>—— 请先读取账套 ——</option></select>
              <button class="btn">读取账套</button>
            </div>
          </label>
          <div class="form-footer">
            <button class="btn" onclick="go(1)">上一步</button>
            <button class="btn btn-primary">保存并进入软件</button>
          </div>
        </div>
      </div>
    </main>
    <footer><span>科技不是高高在上，而是服务于人民</span><span class="ver">v2.9.7</span></footer>
  </section>

  <div class="seal-art" id="seal"><span>N</span></div>

<script>
  function go(n) {
    const s1 = document.getElementById('s1')
    const s2 = document.getElementById('s2')
    const seal = document.getElementById('seal')
    // 印章只在欢迎屏出现：切走后淡出，切回来淡入
    if (n === 2) {
      s1.classList.remove('on'); s2.classList.add('on')
      seal.style.opacity = '0'; seal.style.transition = 'opacity 260ms ease'
    } else {
      s2.classList.remove('on'); s1.classList.add('on')
      seal.style.opacity = '0.42'
    }
    // 重播入场动画：去掉 .on 再挂回去，让 CSS 动画重新计一次
    const target = n === 2 ? s2 : s1
    target.querySelectorAll('.reveal').forEach((el) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '' })
  }
</script>
</body>
</html>
