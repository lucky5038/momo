<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Momo传值助手 · 让ERP在中国普遍成功</title>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#172033;--line:#2d3a4f;
  --acc:#38bdf8;--ok:#22c55e;--warn:#ef4444;--text:#e2e8f0;--muted:#94a3b8;
  --input:#0b1220;--radius:8px;
}
*{box-sizing:border-box;}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;}

/* ===== header ===== */
.app-header{background:var(--card);border-bottom:2px solid var(--acc);padding:18px 24px 14px;}
.app-header h1{font-size:20px;margin:0 0 4px;color:var(--acc);letter-spacing:.3px;}
.app-header .subtitle{font-size:12px;color:var(--muted);line-height:1.8;}

/* ===== main container ===== */
.container{max-width:1200px;margin:0 auto;padding:20px 24px 40px;}

/* ===== conn banner ===== */
#connBanner{border-radius:var(--radius);padding:11px 64px;margin-bottom:16px;font-size:13px;line-height:1.5;
  position:relative;background:var(--input);border:1px solid var(--line);text-align:center;}
#connBannerText{display:block;text-align:center;font-size:13px;font-weight:500;}
#connBanner button#btnReconnect{display:none;margin:0 auto;padding:4px 12px;font-size:12px;position:static;}
#connBanner.loading .banner-row{text-align:center;}
#connBanner.err button#btnReconnect{display:inline-block;margin:8px auto 0;}
#connBanner .gx-mark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:#64748b;font-weight:700;letter-spacing:1px;}

/* ===== tabs ===== */
.tabbar{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:20px;}
.tabbtn{background:none;border:none;color:var(--muted);font:600 14px 'Segoe UI',sans-serif;
  padding:10px 20px;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tabbtn:hover{color:var(--text);}
.tabbtn.active{color:var(--acc);border-bottom-color:var(--acc);}

/* ===== card ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;
  padding-bottom:8px;border-bottom:1px solid var(--line);}

/* ===== labels & inputs ===== */
label.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.2px;}
select,input[type=text],input[type=password]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;
  background:var(--input);color:var(--text);font-size:14px;outline:none;transition:border-color .15s;}
select:focus,input[type=text]:focus,input[type=password]:focus{border-color:var(--acc);}
select:disabled,input[type=text]:disabled,input[type=password]:disabled{opacity:.5;cursor:not-allowed;}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.sub{font-size:11px;color:#64748b;margin-top:4px;}

/* ===== checkbox ===== */
.chk{font-size:13px;color:var(--muted);display:inline-block;margin-right:16px;}
.chk input{vertical-align:middle;margin-right:6px;accent-color:var(--acc);}

/* ===== buttons ===== */
.btn{background:var(--acc);color:#000;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;
  font-size:14px;font-weight:600;transition:opacity .15s,background .15s;}
.btn:hover{opacity:.85;}
.btn.primary{background:var(--ok);}
.btn.danger{background:var(--warn);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.sm{padding:6px 12px;font-size:12px;}

/* ===== value toolbar ===== */
.action-panel{grid-column:1/-1;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:12px;margin:16px 0;}
.action-main{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.action-settings,.action-buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.action-panel .chk{margin:0;white-space:nowrap;}

/* ===== status ===== */
.status{font-size:13px;margin:12px 0;display:block;}
.status.ok{color:var(--ok);}
.status.err{color:var(--warn);}

/* ===== pre / code ===== */
pre{background:var(--input);padding:12px;border-radius:6px;font-size:12px;overflow-x:auto;
  color:var(--muted);white-space:pre-wrap;word-break:break-word;margin:8px 0;border:1px solid var(--line);}
code{font-family:Consolas,"Courier New",monospace;font-size:12px;color:var(--acc);}

/* ===== table ===== */
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
tr:hover td{background:rgba(56,189,248,.04);}

/* ===== tags ===== */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;
  background:var(--input);border:1px solid var(--line);margin:0 6px 4px 0;color:var(--acc);}

/* ===== summary box ===== */
.summary{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:10px;font-size:13px;line-height:1.8;}
.summary b{color:var(--acc);}

/* ===== main table box ===== */
.maintbl{display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--line);
  border-radius:6px;padding:8px 12px;margin:8px 0;font-size:12px;flex-wrap:wrap;}
.maintbl .lbl2{color:var(--muted);font-weight:600;}
.maintbl .val{color:var(--acc);font-family:Consolas,monospace;}
.arrow{color:var(--warn);font-weight:700;}

/* ===== disabled state ===== */
.disabled{opacity:.4;pointer-events:none;}

/* ===== combobox ===== */
.combobox{position:relative;}
.cb-list{display:none;position:absolute;top:100%;left:0;right:0;background:var(--input);
  border:1px solid var(--line);border-radius:0 0 6px 6px;max-height:220px;overflow-y:auto;z-index:30;
  box-shadow:0 6px 18px rgba(0,0,0,.4);}
.cb-list.open{display:block;}
.cb-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--card);color:var(--text);}
.cb-item small{color:var(--muted);margin-left:8px;font-family:Consolas,monospace;}
.cb-item:hover,.cb-item.active{background:var(--card);color:var(--acc);}
.cb-item .desc{display:block;color:#64748b;font-size:11px;margin-top:2px;}

/* ===== trigger table ===== */
.trig-table th,.trig-table td{vertical-align:middle;}
.trig-table .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.trig-table .badge.on{background:rgba(34,197,94,.15);color:var(--ok);}
.trig-table .badge.off{background:rgba(239,68,68,.15);color:var(--warn);}

/* ===== chain row ===== */
.chainrow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px;}
.chainrow input{padding:8px 10px;}
.chainrow .btn{align-self:center;}

/* ===== responsive ===== */
@media(max-width:768px){
  .grid3{grid-template-columns:1fr;}
  .grid{grid-template-columns:1fr;}
  .container{padding:16px;}
}

/* ===== 数据库连接网格 ===== */
.conn-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.4fr;gap:14px;margin-bottom:10px;align-items:end;}
.conn-field{display:flex;flex-direction:column;}
.conn-field-wide{grid-column:span 1;}
.pass-wrap{position:relative;display:block;height:40px;}
.pass-wrap input{padding-right:36px !important;height:40px !important;}
.pass-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;color:#64748b;font-size:11px;cursor:pointer;
  padding:4px 6px;letter-spacing:.3px;transition:color .15s;height:24px;line-height:1;}
.pass-toggle:hover{color:var(--acc);}

/* ===== 整体微调 ===== */
.card{padding:18px 20px 16px;}
.card-title{margin-bottom:12px;}

@media(max-width:900px){
  .conn-grid{grid-template-columns:repeat(2,1fr);}
}

#connServer,#connUser,#connPass,select#connDbSel{
  background-color:var(--input) !important;background-image:none !important;
  border:1px solid var(--line) !important;color:var(--text) !important;}
#connServer:focus,#connUser:focus,#connPass:focus,#connDbSel:focus:focus{
  background-color:var(--input) !important;border-color:var(--acc) !important;outline:none;}
#connServer:active,#connUser:active,#connPass:active{background-color:var(--input) !important;}
#connServer option,#connDbSel option{background-color:var(--card);color:var(--text);}
/* datalist 弹层跟随深色（Chromium） */
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--input) inset !important;-webkit-text-fill-color:var(--text) !important;}
input:-webkit-autofill:hover{-webkit-box-shadow:0 0 0 1000px var(--input) inset !important;}
input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--input) inset !important;border-color:var(--acc) !important;}

#connServer,#connUser,#connPass,.pass-wrap input{height:40px;padding:0 12px;}

/* ===== 干跑预览 ===== */
.pv-wrap{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-top:8px;}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line);}
.pv-title{font-size:14px;font-family:Consolas,monospace;color:var(--text);line-height:1.8;word-break:break-all;}
.pv-target{color:var(--acc);font-weight:600;}
.pv-arrow{color:var(--muted);margin:0 6px;}
.pv-source{color:#7dd3fc;}
.pv-count{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:.3px;}
.pv-count b{font-size:24px;color:var(--ok);margin-right:6px;font-weight:700;}
.pv-tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
.pv-tags .tag{margin:0;}
.tag-blue{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.3);color:#7dd3fc;}
.pv-table-wrap{margin-top:16px;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px;}
.pv-table{margin:0;font-size:13px;}
.pv-table thead th{position:sticky;top:0;background:var(--card2);z-index:2;}
.pv-table td{padding:10px 12px;}
.pv-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.pv-mono{font-family:Consolas,monospace;color:var(--text);}
.pv-cur{color:var(--muted);}
.pv-new{color:var(--ok);font-weight:700;font-family:Consolas,monospace;}
.pv-empty{margin-top:16px;padding:28px 20px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:13px;text-align:center;}
.pv-foot{margin-top:10px;font-size:11px;color:var(--muted);}
</style>
</head>
<body>

<main class="container">
<div style="text-align:center;padding:14px 0 10px;font-size:13px;color:var(--muted);letter-spacing:.5px;font-weight:500">科技不是高高在上，而是服务于人民</div>

<div id="connBanner" class="loading"><div class="banner-row"><span id="connBannerText">正在连接数据库...</span><button id="btnReconnect" class="btn sm" type="button" style="display:none">重新连接</button></div><span class="gx-mark">GX</span></div>

<!-- 数据库连接管理 -->
<div class="card" id="dbConnCard">
  <div class="card-title">数据库连接</div>
  <div class="conn-grid">
    <div class="conn-field">
      <label class="lbl">服务器</label>
      <input type="text" id="connServer" style="font-family:Consolas,monospace" autocomplete="off" placeholder="输入服务器地址">
    </div>
    <div class="conn-field">
      <label class="lbl">账号</label>
      <input type="text" id="connUser" style="font-family:Consolas,monospace" autocomplete="off">
    </div>
    <div class="conn-field">
      <label class="lbl">密码</label>
      <div class="pass-wrap">
        <input type="password" id="connPass" style="font-family:Consolas,monospace" autocomplete="off">
        <button id="btnTogglePass" type="button" title="显示/隐藏密码" class="pass-toggle">显示</button>
      </div>
    </div>
    <div class="conn-field conn-field-wide">
      <label class="lbl">账套（数据库）</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="connDbSel" style="flex:1"></select>
        <button class="btn sm" id="btnLoadDbs" type="button" title="刷新账套列表">刷新</button>
      </div>
    </div>
  </div>
  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center">
    <button class="btn sm" id="btnTestConn" type="button">测试连接</button>
    <button class="btn sm" id="btnSaveConfig" type="button" title="将当前连接参数保存到配置文件">保存配置</button>
    <span id="connMetaNote" style="font-size:11px;color:#64748b"></span>
  </div>
  <div style="margin-top:6px;font-size:11px;color:#475569">提示：连接参数来自配置文件，修改后点「保存配置」即可持久化。换电脑时修改服务器地址即可。</div>
</div>

<div id="tab-sync">
<div class="card">
  <div class="card-title">跨表带值</div>
  <div class="grid3">
    <div>
      <label class="lbl">① 单据（主表）</label>
      <select id="docSel"></select>
      <div class="sub" id="docSub"></div>
      <div class="maintbl" id="mainBox">
        <span class="lbl2">主表</span>
        <span class="val" id="mainTbl">—</span>
        <span class="arrow">→</span>
        <span class="lbl2">取</span>
        <span class="val" id="subTbl">—</span>
      </div>
    </div>
    <div>
      <label class="lbl">② 目标列（要写入哪一列）</label>
      <div class="combobox">
        <input type="text" id="fTgt" placeholder="搜索目标列..." autocomplete="off"
          onclick="openCb('fTgt','cbTgt')" oninput="openCb('fTgt','cbTgt')" onfocus="openCb('fTgt','cbTgt')" onblur="setTimeout(()=>closeCb('cbTgt'),150)">
        <div id="cbTgt" class="cb-list"></div>
      </div>
      <div class="sub" id="tgtSub"></div>
    </div>
    <div id="srcWrap">
      <label class="lbl">③ 来源档（自动排除已选单据）</label>
      <select id="srcSel" class="disabled"></select>
    </div>
    <div id="src2Wrap" style="display:none">
      <label class="lbl">③½ 来源档②（可选·链式取值）</label>
    </div>
  </div>
  <div class="grid">
    <div id="valWrap">
      <label class="lbl">④ 来源值列（取哪一列的值，可搜索切换）</label>
      <div class="combobox">
        <input type="text" id="fVal" placeholder="先选择来源档，再选来源值列..." autocomplete="off"
          onclick="openCb('fVal','cbVal')" oninput="openCb('fVal','cbVal')" onfocus="openCb('fVal','cbVal')" onblur="setTimeout(()=>closeCb('cbVal'),150)">
        <div id="cbVal" class="cb-list"></div>
      </div>
      <div class="sub" id="valSub"></div>
      <div id="val2Wrap" style="display:none">
      <div style="margin-top:8px">
        <label class="chk" style="display:inline"><input type="checkbox" id="chkAllVals" checked onchange="onSrcChange()"> 显示全部列（默认只显示常用列）</label>
      </div>
    </div>
    
  </div>
  <div class="action-panel">
    <div class="action-main">
      <div class="action-settings">
        <label class="chk"><input type="checkbox" id="chkForce"> 强制覆盖</label>
        <label class="chk"><input type="checkbox" id="chkCreateTrigger"> 建立触发器</label>
        <label class="chk"><input type="checkbox" id="chkMergeDisplay"> 合并显示</label>
      </div>
      <div class="action-buttons">
        <button class="btn" id="btnPreview">干跑预览</button>
        <button class="btn primary" id="btnExec">执行（先备份）</button>
        <button class="btn" id="btnBackupDir" type="button" title="选择或修改数据库备份路径">备份路径</button>
      </div>
    </div>
  </div>
  <div class="sub" id="backupDirNote" style="margin-top:-6px">备份路径：读取中...</div>
  <span class="status" id="status"></span>
  <div id="result"></div>
</div>
</div>

<!-- ============ 已建立触发器 ============ -->
<div class="card" style="margin-top:16px">
  <div class="card-title" style="cursor:pointer" id="trigPanelTitle">▼ 已建立触发器（点击展开）</div>
  <div id="trigPanelBody" style="display:none">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
      <button class="btn sm" id="trigRefresh">刷新列表</button>
      <span class="sub">来自数据库 sys.triggers（父对象 = 用户表）。</span>
    </div>
    <div class="sub" id="trigDbNote" style="margin-bottom:8px;"></div>
    <span class="status" id="trigStatus"></span>
    <div id="trigList"><div class="sub">点击刷新查看触发器列表</div></div>
  </div>
</div>

</main>

<div id="firstOpenModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px 36px;min-width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);">
    <div style="font-size:15px;color:var(--text);margin-bottom:22px;line-height:1.8;">科技不是高高在上，而是服务于人民</div>
    <button class="btn" id="firstOpenOk" type="button">确定</button>
  </div>
</div>

<script>
// API 适配层: 浏览器用 fetch
(function(){
  const F = {
    getMeta: async ()=>{
      // 重试机制：兼容服务刚启动时连接池未就绪（首次 /api/meta 可能 500）
      for (let attempt=0; attempt<6; attempt++) {
        try {
          const r = await fetch("/api/meta");
          const d = await r.json();
          if (r.ok && d.docs && d.srcs) return { ok:true, data:d };
          if (r.ok) return { ok:true, data:d };
        } catch (_) {}
        if (attempt < 5) await new Promise(res => setTimeout(res, 2000));
      }
      throw new Error('/api/meta 多次重试仍失败，请点「重新连接」');
    },
    run: async b=>{ const r=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); const d=await r.json(); return d.error?{ok:false,error:d.error}:{ok:true,data:d}; },
    listTriggers: async ()=>{ const r=await fetch("/api/triggers"); return { ok:true, data: await r.json() }; },
    buildTrigger: async b=>{ const r=await fetch("/api/triggers/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); const d=await r.json(); return d.error?{ok:false,error:d.error}:{ok:true,data:d}; },
    createTrigger: async b=>{ const r=await fetch("/api/triggers/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); const d=await r.json(); return d.error?{ok:false,error:d.error}:{ok:true,data:d}; },
    toggleTrigger: async b=>{ const r=await fetch("/api/triggers/toggle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); const d=await r.json(); return d.error?{ok:false,error:d.error}:{ok:true,data:d}; },
    dropTrigger: async b=>{ const r=await fetch("/api/triggers/drop",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); const d=await r.json(); return d.error?{ok:false,error:d.error}:{ok:true,data:d}; },
    testDb: async (b)=>{ try{ const r=await fetch("/api/test-conn",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}); return await r.json(); }catch(e){ return {ok:false,error:e.message}; } },
    listDatabases: async ()=>{ const r=await fetch("/api/databases"); return { ok:true, data: await r.json() }; },
    switchDb: async b=>{ const r=await fetch("/api/switch-db",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); const d=await r.json(); return d.ok?{ok:true,data:d}:{ok:false,error:d.error}; },
    getConfig: async ()=>{ return {ok:true,data:{db:{server:"browser", database:"DSB"}, backupDir:""}}; },
    saveConfig: async b=>{ try { const r = await fetch("/api/save-config", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(b||{})}); return await r.json(); } catch(e){ return {ok:false, error:e.message}; } },
    reconnect: async ()=>{ return {ok:true,data:{}}; }
  };
  window.chuanzhi = window.chuanzhi || F;
})();

window.__backupDir = 'D:\\TPA\\SQL2008';
let META=null;

// ---- 服务器历史（localStorage，可跨重启记忆，最多10条）----
function getSrvHist(){ try{ return JSON.parse(localStorage.getItem('momo_svr_hist')||'[]'); }catch(_){ return []; } }
function rememberSrv(){ const inp=document.getElementById('connServer'); const v=(inp&&inp.value||'').trim(); if(!v) return; let h=getSrvHist(); if(h.indexOf(v)<0){ h.unshift(v); h=Array.from(new Set(h)).slice(0,20); try{localStorage.setItem('momo_svr_hist',JSON.stringify(h));}catch(_){} } }
async function dropSrv(key){
  try{ await fetch('/api/creds/drop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})}); }catch(_){}
  try{ let h=getSrvHist().filter(x=>x!==key); localStorage.setItem('momo_svr_hist',JSON.stringify(h)); }catch(_){}
  try{ let m=JSON.parse(localStorage.getItem('momo_conn_cred')||'{}'); delete m[key]; localStorage.setItem('momo_conn_cred',JSON.stringify(m)); }catch(_){}
  const inp=document.getElementById('connServer'); if(inp && inp.value.trim()===key) inp.value='';
  rememberSrv();
}

function getCred(){ let base={}; try{ base=JSON.parse(localStorage.getItem('momo_conn_cred')||'{}'); }catch(_){ base={}; } if(window.__creds) for(const k in window.__creds){ if(!base[k]) base[k]=window.__creds[k]; } return base; }
async function rememberCred(){
  const s=(document.getElementById('connServer')||{}).value.trim();
  const u=(document.getElementById('connUser')||{}).value.trim();
  const p=(document.getElementById('connPass')||{}).value;
  if(!s&&!u&&!p) return;
  let m=getCred(); if(s) m[s]={user:u,pass:p};
  try{ localStorage.setItem('momo_conn_cred',JSON.stringify(m)); }catch(_){}
  try{ const _body={}; if(s)_body[s]={user:u,pass:p}; if(u||p)_body._last={user:u,pass:p}; await fetch('/api/creds/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(_body)}); }catch(_){}
}
function applyCred(sv){
  const m=getCred(); const c=m[sv]; if(!c) return;
  const ue=document.getElementById('connUser'); if(ue&&c.user) ue.value=c.user;
  const pe=document.getElementById('connPass'); if(pe&&c.pass) pe.value=c.pass;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// 列号友好标签
function labelOf(col, desc, vals){
  if (vals && vals[col]) return vals[col];
  const m = String(col||'').match(/^([A-Z]{3})(9\d{2})$/);
  if (m){
    const n = parseInt(m[2].slice(1), 10);
    if (n >= 1 && n <= 5)   return '系统字段' + m[2];
    if (n >= 60 && n <= 75) return '自定文字' + (n - 59);
    if (n >= 80 && n <= 95) return '自定数字' + (n - 79);
    if (n >= 96 && n <= 99) return '保留列' + m[2];
    if (n === 79) return '其他979';
    return '列' + m[2];
  }
  return col + (desc ? '（' + desc + '）' : '');
}

function commonCols(cols, src){
  const ids = src && src.vals ? Object.keys(src.vals) : [];
  const sys = cols.filter(c=>!String(c.col).includes('9')).slice(0,6).map(c=>c.col);
  const keep = new Set([...ids, ...sys]);
  return cols.filter(c=>keep.has(c.col) || String(c.col).includes('96'));
}

function openCb(fid, listId){
  const input=document.getElementById(fid);
  const list=document.getElementById(listId);
  const q=input.value.toUpperCase();
  let cols; let srcs; let valsMap={};
  if(listId==='cbTgt'){ cols=tgtCols;
    if(!cols.length){ list.innerHTML='<div class="cb-item" style="color:#64748b">（请先选择单据）</div>';list.classList.add('open');return; } }
  else { srcs=currentSrc(); cols=valCols; valsMap=srcs?.vals||{};
    if(!document.getElementById('chkAllVals').checked) cols=commonCols(cols,srcs); }
  list.innerHTML='';
  if(!cols||!cols.length){
    const msg = listId==='cbVal' && !currentSrc() ? '（请先选择来源档）' : '（暂无可选项）';
    list.innerHTML='<div class="cb-item" style="color:#64748b">'+msg+'</div>';
    list.classList.add('open');
    return;
  }
  cols.filter(c=>c.col.toUpperCase().includes(q)
    ||(c.desc||'').toUpperCase().includes(q)
    ||labelOf(c.col,c.desc,valsMap).toUpperCase().includes(q))
    .forEach(c=>{
      const div=document.createElement('div');
      div.className='cb-item';
      const L=labelOf(c.col,c.desc,valsMap);
      div.innerHTML='<b>'+esc(L)+'</b><small>'+esc(c.col)+'</small>'+(c.desc&&c.desc!==L?'<span class="desc">'+esc(c.desc)+'</span>':'');
      div.onmousedown=(e)=>{ e.preventDefault(); pickCb(fid,listId,c.col); };
      list.appendChild(div);
    });
  if(!list.children.length){ list.innerHTML='<div class="cb-item" style="color:#64748b">（暂无数据，请先选择单据）</div>'; }
  list.classList.add('open');
}

function closeCb(listId){ const l=document.getElementById(listId); if(l) l.classList.remove('open'); }

function onDocChange(){
  if(!META || !Array.isArray(META.srcs)){
    document.getElementById('docSub').textContent='正在加载单据字典，请稍候...';
    return;
  }
  const doc=META?.docs.find(d=>d.id===document.getElementById('docSel').value);
  if(!doc)return;
  document.getElementById('docSub').textContent=doc.sub+' · 品号列 '+(doc.refCol||doc.keyCol)+' · '+(doc.party==='supplier'?'供应商':doc.party==='customer'?'客户':'无')+'侧';
  document.getElementById('mainTbl').textContent=doc.main+'.'+doc.mainKeyCol;
  document.getElementById('subTbl').textContent=doc.sub+'.'+doc.keyCol;

  tgtCols=(META.tgtAllCols?.[doc.id])||[];
  document.getElementById('fTgt').value='';
  document.getElementById('tgtSub').textContent='共 '+tgtCols.length+' 个可选目标列（请选择）';

  const ss=document.getElementById('srcSel');
  ss.innerHTML='';
  ss.disabled=false;
  ss.classList.remove('disabled');
  const ph=document.createElement('option'); ph.value=''; ph.textContent='—— 请选择来源档 ——'; ss.appendChild(ph);
  const exSet=new Set((META.srcExcluded||{})[doc.id]||[]);
  // 业务流向：上游单据不能取下游单据的值，后台自动排除
  const infoGroup=document.createElement('optgroup'); infoGroup.label='信息档';
  META.srcs.forEach(src=>{
    if(exSet.has(src.id))return;      // 业务流向：下游单据自动排除
    if(src.id===doc.id)return;        // 来源档不能与主表是同一张表
    const o=document.createElement('option');
    o.value=src.id; o.textContent=src.name;
    if(src.info) infoGroup.appendChild(o); else ss.appendChild(o);
  });
  if(infoGroup.children.length) ss.appendChild(infoGroup);
  if(ss.options.length<=1){ const vs=document.getElementById('valSub'); if(vs) vs.textContent='当前单据没有可选来源档'; }
  ss.onchange=()=>onSrcChange();
  onSrcChange();

  // 字典加载成功后清除"等待数据库连接"的提示
  const st=document.getElementById('status');
  if(st && String(st.textContent).indexOf('等待数据库连接')===0){ st.className='status'; st.textContent=''; }
}

function refreshJoin(){
  const doc=META?.docs.find(d=>d.id===document.getElementById('docSel').value);
  const src=currentSrc();
  if(!doc||!src)return;
  const joins=['品号: '+src.key[0]+' = '+(doc.refCol||doc.keyCol)];

// 干跑预览结果渲染
function renderPreview(b, d){
  const total = d.totalRows ?? 0;
  const rows = (d.sample || []).map(s => {
    const cur = (s['现值'] === null || s['现值'] === undefined || s['现值'] === '') ? '—' : esc(s['现值']);
    const val = (s['应带'] === null || s['应带'] === undefined || s['应带'] === '') ? '—' : esc(s['应带']);
    return '<tr>'
      + '<td class="pv-mono">' + esc(s['单号'] ?? '') + '</td>'
      + '<td class="pv-mono">' + esc(s['序号'] ?? '') + '</td>'
      + '<td class="pv-cur">' + cur + '</td>'
      + '<td class="pv-new">' + val + '</td>'
      + '</tr>';
  }).join('');

  const tags = '';

  const body = total > 0
    ? '<div class="pv-table-wrap"><table class="pv-table"><thead><tr>'
      + '<th>单号</th><th style="width:90px">序号</th><th>现值</th><th>应带</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      + (total > 50 ? '<div class="pv-foot">仅显示前 50 行，实际共 ' + total + ' 行</div>' : '')
    : '<div class="pv-empty">没有需要填入的行：目标列可能已有值（数值 0 也算已有值，需要覆盖请勾选“强制覆盖”），或来源单据没有匹配数据。</div>';

  return '<div class="pv-wrap">'
    + '<div class="pv-head">'
    +   '<div class="pv-title"><span class="pv-target">' + esc(b.docId) + '.' + esc(b.tgtCol) + '</span>'
    +     '<span class="pv-arrow">←</span><span class="pv-source">' + esc(b.srcId) + '.' + esc(b.srcValCol) + '</span></div>'
    +   '<div class="pv-count"><b>' + total + '</b><span>行待填入</span></div>'
    + '</div>'
    + (tags ? '<div class="pv-tags">' + tags + '</div>' : '')
    + (d.typeWarning ? '<div style="margin:8px 0;padding:8px 10px;border-left:3px solid #f59e0b;background:rgba(245,158,11,.08);color:#fbbf24;font-size:12px;line-height:1.6">⚠ ' + esc(d.typeWarning) + '</div>' : '')
    + body
    + '</div>';
}

async function doRun(confirm){
  const b=curReq(); if(!b)return; b.confirm=confirm;
  const status=document.getElementById('status');
  status.className='status'; status.textContent=confirm?'执行中（备份+写库）...':'干跑预览中...';
  let d;
  try {
    d = await window.chuanzhi.run(b);
    if (d && d.data) d = d.data;
    if (confirm) console.log('[run result]', d);
  } catch(e) {
    status.className='status err'; status.textContent='请求失败：'+e.message;
    return;
  }
  document.getElementById('result').innerHTML='';
  if(d.error){status.className='status err';status.textContent=d.error;return;}
  status.className='status ok';
  if(d.preview){
    status.textContent='预览完成：共 '+(d.totalRows??0)+' 行待填入，审阅后点「执行（先备份）」。';
    document.getElementById('result').innerHTML=renderPreview(b,d);
  } else {
    const aff = (d.affected !== undefined && d.affected !== null) ? d.affected : 0;
    const bp = d.backupPath || '未知路径';
    status.textContent='完成：受影响 '+aff+' 行 · 备份 '+bp;
    let trigMsg = '';
    if(b.createTrigger && d.triggerResult){
      if(d.triggerResult.skipped){
        const forceHint = d.triggerResult.allowForce ? '<br><span style="color:#94a3b8">勾选「强制创建」可忽略此冲突。</span>' : '';
        trigMsg = '<div style="margin-top:8px;padding:8px 12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:6px;color:#f59e0b;font-size:12px">⚠ '+esc(d.triggerResult.note||'检测到系统冲突，已跳过建立触发器')+forceHint+'</div>';
      } else if(d.triggerResult.conflict && d.triggerResult.conflict.length){
        trigMsg = '<div style="margin-top:8px;color:#22c55e">✓ 触发器已创建：'+esc(d.triggerResult.name)+'</div>'
          + '<div style="margin-top:4px;padding:6px 10px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:6px;color:#f59e0b;font-size:11px">⚠ '+esc(d.triggerResult.conflictNote||('系统触发器 '+d.triggerResult.conflict.join('、')+' 也在写此列'))+'</div>';
      } else if(d.triggerResult.ok){
        trigMsg = '<div style="margin-top:8px;color:#22c55e">✓ 触发器已创建：'+esc(d.triggerResult.name)+'</div>';
      } else {
        trigMsg = '<div style="margin-top:8px;color:#ef4444">✗ 触发器创建失败：'+esc(d.triggerResult.error||'未知错误')+'</div>';
      }
    }
    document.getElementById('result').innerHTML=`
      <div class="summary"><b>已写入数据库</b> 受影响 <span style="color:#22c55e">${aff}</span> 行 · 备份文件 <code>${esc(bp)}</code></div>
      <div><b>执行后抽样（前 20）</b>
        <table><thead><tr><th>单号</th><th>已填值</th></tr></thead><tbody>
        ${(d.sampleAfter||[]).map(s=>'<tr><td>'+esc(s.docNo)+'</td><td style="white-space:pre-wrap"><b style="color:#22c55e">'+esc(s.filled)+'</b></td></tr>').join('')}
        </tbody></table>
      </div>
      ${trigMsg}
      <div class="sub" style="margin-top:8px">⚠ 前台易助需<b style="color:#ef4444">关闭该单后重新查询</b>才会显示新值（前台读缓存）。</div>`;
  }
}

async function loadConnBanner(){
  const el=document.getElementById("connBanner");
  const txt=document.getElementById("connBannerText");
  const btn=document.getElementById("btnReconnect");
  el.className="loading";
  if(txt) txt.textContent='等待数据库连接...';

  // 还没保存服务器时属于"等待填写"，不发起连接检测，避免显示成错误
  let cfg={};
  try{ cfg=(await (await fetch('/api/config')).json())||{}; }catch(_){ cfg={}; }
  if(!cfg.server){
    el.className="loading";
    if(txt) txt.innerHTML='<b>等待数据库连接</b> · 请填写服务器、账号、密码后点「测试连接」';
    if(btn) btn.style.display="none";
    return;
  }

  // 只信 /api/meta：有 docs 才算真连上，消除 banner 与字典状态脱节
  let m;
  try{ m=await (await fetch('/api/meta')).json(); }catch(_){ m={}; }
  if(m.docs){
    el.className="ok";
    if(txt) txt.innerHTML='<b style="color:#22c55e">数据库已连接</b> · 服务器 <code>'+esc(m.server||'-')+'</code> · 账套 <code>'+esc(m.currentDb||'-')+'</code>';
    if(btn) btn.style.display="none";
  } else {
    el.className="err";
    const msg=m.error||'未知错误';
    if(txt) txt.innerHTML='<b style="color:#ef4444">数据库连接失败</b>：'+esc(msg)+'。点"重新连接"重试。';
    if(btn) btn.style.display="";
  }
}

async function initDbConn(){
  const r = await window.chuanzhi.listDatabases();
  const sel = document.getElementById("connDbSel");
  if (r.ok) {
    if (!r.data || r.data.error) {
      sel.innerHTML = '<option value="">（等待连接）</option>';
      document.getElementById("connMetaNote").textContent = '等待填写数据库连接信息';
      document.getElementById("connMetaNote").style.color = '#64748b';
      return;
    }
    const dbs = r.data.databases || [];
    const cur = r.data.currentDb;
    sel.innerHTML = dbs.map(d =>
      '<option value="'+esc(d.name)+'"'+(d.name===cur?' selected':'')+'>'+esc(d.name)+'</option>'
    ).join('');
    window.__curDb = cur;
    window.__curDb = cur;
    document.getElementById("connMetaNote").textContent =
      '服务器 '+esc(r.data.server)+' · 共 '+dbs.length+' 个账套';
  } else {
    sel.innerHTML = '<option value="">（无法加载账套列表）</option>';

}
// 服务器变化：拉该服务器账套；有保存的偏好账套则回填，否则选第一个（不自动测连）
async function onServerChanged() {
  const sv = document.getElementById('connServer').value.trim();
  const us = document.getElementById('connUser').value.trim();
  const pw = document.getElementById('connPass').value;
  if (!sv) return;
  // 记住用户当前选中的账套，刷新列表后优先保留，避免点「测试连接」被重置到第一个账套
  const sel = document.getElementById('connDbSel');
  const prevDb = sel ? sel.value : '';
  let r;
  try {
    const resp = await fetch('/api/databases', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({server:sv, user:us, password:pw}) });
    r = await resp.json();
  } catch (e) { r = { ok:false, error:e.message }; }
  const note = document.getElementById('connMetaNote');
  if (r.ok || r.databases) {
    const dbs = r.databases || [];
    sel.innerHTML = dbs.map(d => '<option value="'+d.name+'">'+d.name+'</option>').join('') || '<option value="">&nbsp;</option>';
    const pref = (window.__prefs && window.__prefs[sv] && window.__prefs[sv].db);
    let pick = -1;
    let kept = '';
    if (prevDb) { pick = dbs.findIndex(x => x.name === prevDb); if (pick >= 0) kept = prevDb; }
    if (pick < 0 && pref) { pick = dbs.findIndex(x => x.name === pref); if (pick >= 0) kept = pref; }
    if (pick < 0 && sel.options.length > 0) pick = 0;
    if (pick >= 0) sel.selectedIndex = pick;
    note.textContent = '已识别 ' + sv + ' 的 ' + dbs.length + ' 个账套' + (kept ? '，保留当前账套 ' + kept : '，已选中第一个');
    note.style.color = '#22c55e';
    loadConnBanner();
  } else {
    note.textContent = '无法连接 ' + sv + '：' + (r.error || '登录失败');
    note.style.color = '#ef4444';
  }
}
document.getElementById("btnLoadDbs").onclick = async () => {
  const sel = document.getElementById("connDbSel");

      const dbs = d.databases || [];

      sel.innerHTML = dbs.map(x =>
        '<option value="'+esc(x.name)+'"'+(x.name===cur?' selected':'')+'>'+esc(x.name)+'</option>'
      ).join('');

      note.style.color = "#22c55e";
    } else {
      sel.innerHTML = '<option value="">（无法加载账套列表）</option>';
      note.textContent = d.error || '连接失败';
      note.style.color = "#ef4444";
    }
  };
  // 有密码时优先用界面参数；失败则自动回退到 GET（后端保存的配置）
  if (sv && us && pw) {
    try {
      const r = await fetch("/api/databases", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ server: sv, user: us, password: pw })
      });
      const raw = await r.json();
      const d = raw.ok ? raw : (raw.databases ? { ok: true, ...raw } : { ok: false, error: raw.error || '连接失败' });
      if (d.ok) { apply(d, 'post'); return; }
      // POST 失败，回退到 GET
      console.log('[刷新] POST 失败，回退到保存配置:', d.error);
    } catch (e) { console.log('[刷新] POST 请求异常:', e.message); }
  }
  try {
    const r = await fetch("/api/databases");
    const d = await r.json();
    // GET 响应没有 ok 字段，有 databases 数组即视为成功
    apply(d.databases ? { ok: true, ...d } : { ok: false, error: d.error || '连接失败' }, 'fallback');
  } catch (e) {
    note.textContent = '请求失败: ' + e.message;
    note.style.color = "#ef4444";
  }
};

// ---- initial load sequence ----
// 1. Load database list + banner first (so user sees connection state immediately)
// 2. Then load document/source metadata in the background
(async function boot(){
  let cfgData = {};
  try {
    // 启动时先读「保存配置」写入的 config.js，它是表单回填的权威来源
    try { cfgData = (await (await fetch('/api/config')).json()) || {}; } catch (_) { cfgData = {}; }
    if (cfgData.backupDir) window.__backupDir = cfgData.backupDir;

    let initMeta;
    try { initMeta = await (await fetch('/api/meta')).json(); } catch(_) { initMeta = {}; }
    // 即使 /api/meta 连接成功，也用保存的配置补齐服务器/账号/密码
    if (cfgData.server || cfgData.user || cfgData.password) {
      initMeta = {
        ...initMeta,
        server: cfgData.server || initMeta.server || '',
        user: cfgData.user || initMeta.user || '',
        password: cfgData.password || initMeta.password || ''
      };
    }
    let _creds={}; try{ const cr=await (await fetch('/api/creds')).json(); if(cr&&cr.ok){ _creds=cr.data||{}; window.__creds=_creds; } }catch(_){}
    // 启动时立即刷 banner + 账套列表（只建一次连接，不额外触发测试连接）
    await initDbConn();
    await loadConnBanner();
    // 加载按服务器的账套偏好（prefs），供切服务器时自动回填手选账套
    window.__prefs = (_creds.prefs && typeof _creds.prefs==='object') ? _creds.prefs : {};
    // 若 _lastServer 有偏好账号密码，启动时默认填它（“上次保存的数据库”）
    const _lastSvr = _creds._lastServer;
    // 服务器 + 账号 + 密码 一起带出：优先按当前服务器匹配凭据，匹配不到用 _last
    (function fillAll(){
      const inp=document.getElementById('connServer'); const u=document.getElementById('connUser'); const pw=document.getElementById('connPass');
      if(!inp) return;
      const sv=initMeta.server||'';
      if(sv && !inp.value){ inp.value=sv; }
      // 优先用 config.js（"保存配置"的权威值），再兜底 creds.json
      let c=null;
      if(initMeta.user || initMeta.password){ c={user:initMeta.user||'', pass:initMeta.password||''}; }
      else { c=(sv && _creds[sv]) || _creds['_last'] || null; }
      if(c){ if(u&&c.user)u.value=c.user; if(pw&&c.pass)pw.value=c.pass; }
      // 若当前服务器有保存的偏好账套，选中它（“上次手选”的账套）
      const pP = sv && window.__prefs[sv];
      if(pP && pP.db){ try{ const sel=document.getElementById('connDbSel'); const opts=[].slice.call(sel.options); const m=opts.find(o=>o.value===pP.db); if(m){ sel.value=pP.db; } }catch(_){} }
    })();

    // 关键修复：把 creds.json（磁盘记忆）里已保存的所有服务器并入下拉历史，
    // 这样即使 localStorage 被重置/换电脑，下拉也永不为空、▼ 一展开就可见
    try{
      let h=getSrvHist();
      for(const k in _creds){ if(k==='_last') continue; if(h.indexOf(k)<0){ h.push(k); } }
      h=Array.from(new Set(h)).slice(0,10);
      localStorage.setItem('momo_svr_hist', JSON.stringify(h));
    }catch(_){}
  } catch (e) {
    console.error('db init error:', e);
    const txt=document.getElementById('connBannerText');
    const el=document.getElementById('connBanner');
    if(txt && el){ el.className='err'; txt.innerHTML='<b style="color:#ef4444">初始化失败</b>：'+esc(e.message)+'。请点"重新连接"。'; }
  }
  // 没有保存服务器时不做字典加载，避免首次打开显示"字典加载失败"
  if (cfgData.server) {
    init().catch(e => {
      console.error('meta load error:', e);
      const status=document.getElementById('status');
      if(status){ status.className='status err'; status.textContent='加载单据字典失败：'+e.message; }
    });
  } else {
    const status=document.getElementById('status');
    if(status){ status.className='status'; status.textContent='等待数据库连接后加载单据字典'; }
  }

  (function(){
    const sv=document.getElementById('connServer');
    if(!sv) return;
    sv.addEventListener('input', function(){ applyCred(sv.value.trim()); });
    sv.addEventListener('change', function(){ rememberSrv(); applyCred(sv.value.trim()); onServerChanged(); });
  })();

  // 首次打开提示：应用内弹窗（不使用原生 alert，避免关闭后窗口失焦无法输入）
  try {
    const fo = await (await fetch('/api/first-open')).json();
    if (fo && fo.ok && !fo.seen) {
      await fetch('/api/first-open', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const modal = document.getElementById('firstOpenModal');
      if (modal) {
        modal.style.display = 'flex';
        const ok = document.getElementById('firstOpenOk');
        if (ok) ok.focus();
      }
    }
  } catch (e) {}
})();

<script>

(function(){

async function refreshTrigList(){
  const el=document.getElementById("trigList");

    onTable:document.getElementById("tgOnTable").value.trim(),
    tgtTable:document.getElementById("tgTgtTable").value.trim(),
    tgtCol:document.getElementById("tgTgtCol").value.trim(),
    chain:readChain(),
    mode:document.getElementById("tgForce").checked?"force":"fill"
  };
}

window.refreshTrigList = refreshTrigList;
document.getElementById("trigRefresh").onclick=refreshTrigList;
const _bac=document.getElementById("btnAddChain"); if(_bac) _bac.onclick=()=>chainRow();

(function(){const _bfb=document.getElementById("btnTgBuild"); if(_bfb) _bfb.onclick=async()=>{
  const b=curTgReq();
  if(!b.trgName||!b.onTable||!b.tgtTable||!b.tgtCol||!b.chain.length){
    statusEl().className="status err";
    statusEl().textContent="请填写完整：触发器名、挂载表、目标列、以及至少一行取值链";
    return;
  }
  statusEl().className="status";
  statusEl().textContent="预览中...";
  const r=await window.chuanzhi.buildTrigger(b);
  const st=statusEl();
  const box=document.getElementById("trigResult");
  if(!r.ok){ st.className="status err"; st.textContent=r.error; return; }
  st.className="status ok"; st.textContent="映射检查完成，点「创建」建立触发器。";
  box.innerHTML='';
};
})();

(function(){const _bfc=document.getElementById("btnTgCreate"); if(_bfc) _bfc.onclick=async()=>{
  const b=curTgReq();
  if(!b.trgName||!b.onTable||!b.tgtTable||!b.tgtCol||!b.chain.length){
    statusEl().className="status err";
    statusEl().textContent="请填写完整后再创建";
    return;
  }
  statusEl().className="status"; statusEl().textContent="构建中...";
  const tr=await window.chuanzhi.buildTrigger(b);
  if(!tr.ok){ statusEl().className="status err"; statusEl().textContent=tr.error; return; }
  if(!confirm("确认创建触发器？会先自动备份到 "+(window.__backupDir||"D:\\TPA\\SQL2008")))return;
  const r=await window.chuanzhi.createTrigger({trgName:b.trgName, onTable:b.onTable, trigSql:tr.data.triggerSql, confirm:true});
  statusEl().className="status "+(r.ok?"ok":"err");
    statusEl().textContent=r.ok?("已创建 "+r.data.name+" · 数据库 "+(r.data.database||"-")+" · 备份 "+r.data.backupPath):r.error;
  refreshTrigList();
};
})();

chainRow();
})();
</script>
<script>
(function(){
  const m=document.getElementById('firstOpenModal');
  const b=document.getElementById('firstOpenOk');
  if(b) b.onclick=function(){
    if(m) m.style.display='none';
    const s=document.getElementById('connServer');
    if(s){ try{ s.focus(); }catch(_){} }
  };
})();
</script>
</body>
